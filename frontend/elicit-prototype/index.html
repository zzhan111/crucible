<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专家规则诱出 · 原型 v0.2（Crucible 中间层）</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --line: #e5e7eb; --line2: #eef0f3; --text: #1f2937; --muted: #6b7280; --faint: #9ca3af;
  --accent: #2563eb; --accent-soft: #eff6ff; --good: #16a34a; --good-soft: #dcfce7; --mid: #d97706; --mid-soft: #fef3c7; --bad: #dc2626; --bad-soft: #fee2e2;
  --mock: #7c3aed; --mock-soft: #f5f3ff; --seed: #0369a1; --seed-soft: #e0f2fe; --r: 10px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; font-size: inherit; }
#app { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; height: 100vh; }
body.right-closed #app { grid-template-columns: 220px minmax(0, 1fr) 0; }
body.right-closed #right { display: none; }
#sidebar { background: #111827; color: #e5e7eb; display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
#main { overflow-y: auto; min-width: 0; }
#right { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

/* 侧栏 */
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px 16px; }
.brand b { color: #fff; font-size: 15px; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: #2563eb; display: grid; place-items: center; color: #fff; font-weight: 700; }
#sidebar .muted { color: #9ca3af; }
.new-session { width: 100%; background: #1f2937 !important; color: #e5e7eb !important; border: 1px dashed #4b5563 !important; margin-bottom: 14px; }
.new-session:hover { background: #374151 !important; }
.side-label { font-size: 11px; color: #9ca3af; padding: 0 6px 6px; }
.sess { display: flex; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
.sess:hover { background: #1f2937; }
.sess.active { background: #374151; }
.sess-icon { width: 28px; height: 28px; border-radius: 7px; background: #4b5563; display: grid; place-items: center; font-size: 13px; color: #fff; flex: none; }
.sess.active .sess-icon { background: var(--accent); }
.sess-name { font-size: 13.5px; color: #f9fafb; }
.sess-sub { font-size: 11px; color: #9ca3af; }
.side-foot { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.side-foot .btn { background: transparent; color: #d1d5db; border-color: #4b5563; }
.side-foot .btn:hover { background: #1f2937; }

/* 通用 */
.btn { border: 1px solid var(--line); background: #fff; color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; line-height: 1.4; white-space: nowrap; }
.btn:hover { background: #f9fafb; border-color: #d1d5db; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #1d4ed8; }
.btn.primary:disabled { background: #bfdbfe; border-color: #bfdbfe; cursor: not-allowed; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.danger-text { color: var(--bad) !important; }
.icon-btn { border: none; background: transparent; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px 6px; border-radius: 6px; line-height: 1; }
.icon-btn:hover { background: #f3f4f6; color: var(--text); }
.icon-btn.tiny { font-size: 12px; padding: 0 3px; }
.input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; color: inherit; background: #fff; width: 100%; }
.input:focus { outline: 2px solid #bfdbfe; border-color: var(--accent); }
.input.sm { padding: 3px 7px; font-size: 13px; width: auto; }
.input.num { width: 80px; }
.input.grow, .grow { flex: 1; min-width: 120px; }
textarea.input { resize: vertical; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; } .center { text-align: center; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .spacer { flex: 1; }
.link { color: var(--accent); cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }
.warn-text { color: var(--mid); }
.missing { color: var(--bad); }
.pad { padding: 8px; }
h4 { margin: 14px 0 6px; font-size: 13.5px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #f3f4f6; color: var(--muted); margin-left: 4px; vertical-align: middle; white-space: nowrap; }
.b-expert { background: #dbeafe; color: #1e40af; } .b-default { background: #f3f4f6; color: #4b5563; }
.b-warn { background: var(--bad-soft); color: var(--bad); } .b-off { background: #f3f4f6; color: var(--faint); } .b-ver { background: var(--accent-soft); color: var(--accent); }
.mock-tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 4px; border: 1px dashed var(--mock); color: var(--mock); background: var(--mock-soft); margin-left: 4px; vertical-align: middle; white-space: nowrap; line-height: 1.6; }
.seed-tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--seed-soft); color: var(--seed); margin-left: 4px; vertical-align: middle; white-space: nowrap; line-height: 1.6; }
.vd { display: inline-block; min-width: 22px; text-align: center; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 5px; line-height: 1.7; }
.vd.lg { font-size: 18px; padding: 2px 12px; border-radius: 8px; }
.vd-good { background: var(--good-soft); color: var(--good); } .vd-mid { background: var(--mid-soft); color: var(--mid); } .vd-bad { background: var(--bad-soft); color: var(--bad); }
.rid { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: #f3f4f6; color: #374151; padding: 0 5px; border-radius: 4px; margin-right: 4px; }
.quote { border-left: 3px solid #93c5fd; background: #f8fafc; padding: 4px 8px; margin: 4px 0; color: #374151; border-radius: 0 6px 6px 0; font-size: 13px; }
.quote.small { font-size: 12px; padding: 2px 8px; }
.quote.inline { display: inline; border: none; background: none; padding: 0; color: #4b5563; font-size: 12.5px; }
.quote.missing { border-left-color: #fca5a5; color: var(--bad); }
.why { font-size: 12.5px; color: #4b5563; background: var(--mock-soft); border-radius: 6px; padding: 3px 8px; margin: 4px 0; }
.chip { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: #f3f4f6; color: #374151; line-height: 1.8; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.c-src { background: #ecfeff; color: #0e7490; }
.c-cat { background: color-mix(in srgb, var(--c) 14%, white); color: color-mix(in srgb, var(--c) 75%, black); }
.c-warn { background: #fff7ed; color: #c2410c; }
.c-scope { background: var(--accent-soft); color: #1e40af; }
.c-all { background: #f9fafb; color: var(--faint); border: 1px dashed #d1d5db; }
.c-add { background: #fff; border: 1px dashed #bfdbfe; color: var(--accent); cursor: pointer; }
.c-dist { background: #f0fdf4; color: #166534; }
.chip-x { border: none; background: transparent; color: #3b82f6; cursor: pointer; padding: 0 0 0 2px; font-size: 12px; line-height: 1; }
.chip-x:hover { color: var(--bad); }
.scope-k { font-size: 11px; color: var(--faint); margin-left: 4px; }
.scope-k:first-child { margin-left: 0; }
.tchip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: #374151; margin: 2px 4px 2px 0; }
.tchip:hover { border-color: #93c5fd; }
.tchip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.tchip.sugg { border-style: dashed; border-color: #93c5fd; color: #1e40af; background: var(--accent-soft); text-align: left; }
.empty-note { color: var(--faint); font-size: 12.5px; padding: 8px 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 14px 0; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.warn-card { border-color: #fcd34d; background: #fffdf5; }
details.card > summary { cursor: pointer; }

/* 主区头部 */
.main-head { position: sticky; top: 0; background: rgba(246, 247, 249, .96); backdrop-filter: blur(6px); z-index: 5; padding: 16px 24px 0; border-bottom: 1px solid var(--line); }
.title-row { display: flex; align-items: center; gap: 8px; }
.title-row h1 { font-size: 19px; margin: 0; }
.scenario { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: #4b5563; margin: 6px 0 8px; }
.scenario i { font-style: normal; color: var(--faint); margin-right: 6px; }
.seed-banner { display: flex; align-items: center; gap: 10px; background: var(--seed-soft); color: #075985; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 8px; }
.seed-banner span { flex: 1; }
.steps { display: flex; gap: 2px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 6px; background: transparent; border: none; border-bottom: 2px solid transparent; padding: 8px 12px 9px; cursor: pointer; color: #4b5563; white-space: nowrap; }
.step:hover { color: var(--text); }
.step.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.step-n { font-size: 15px; }
.step-b { font-size: 11px; background: #eef0f3; color: var(--muted); border-radius: 999px; padding: 0 7px; font-weight: 400; }
.step.on .step-b { background: var(--accent-soft); color: var(--accent); }
.step.alert .step-b { background: var(--bad-soft); color: var(--bad); }
.screen { padding: 18px 24px 60px; max-width: 1100px; }
.intro { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 12px 16px; margin-bottom: 14px; }
.intro-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.intro-body { color: #4b5563; font-size: 13px; }
.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0; }

/* 商品卡片 */
.item { display: flex; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 10px; min-width: 0; position: relative; }
.thumb { width: 40px; height: 40px; flex: none; border-radius: 9px; background: color-mix(in srgb, var(--c) 18%, white); color: color-mix(in srgb, var(--c) 80%, black); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.thumb.big { width: 52px; height: 52px; font-size: 14px; }
.item-body { min-width: 0; flex: 1; }
.item-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-meta { font-size: 12.5px; color: #4b5563; margin: 1px 0 4px; }
.mini-item { display: inline-block; font-size: 12px; background: #f9fafb; border: 1px solid var(--line2); border-radius: 6px; padding: 0 6px; margin: 2px 4px 2px 0; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.mini-item:hover { border-color: #93c5fd; }
.mini-item em { font-style: normal; color: var(--muted); }
.hit-list { margin: 6px 0; }
.hit-list.exc .mini-item { text-decoration: line-through; color: var(--faint); }

/* ① 三元 */
.triad-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 8px 0 12px; }
.triad-card { flex-direction: column; cursor: pointer; padding: 14px; transition: transform .1s, box-shadow .1s; }
.triad-card:hover { box-shadow: 0 4px 14px rgba(0, 0, 0, .06); transform: translateY(-1px); }
.triad-card .item-name { white-space: normal; }
.triad-card.odd { border: 2px solid var(--mid); background: #fffbeb; }
.triad-card.pair { border: 2px solid #93c5fd; }
.triad-tag { margin-top: 8px; font-size: 12px; color: var(--muted); }
.triad-card.odd .triad-tag { color: var(--mid); font-weight: 600; }
.triad-card.pair .triad-tag { color: var(--accent); }
.triad-form .tf-row { margin-bottom: 10px; }
.triad-form label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: 500; }
.rate-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px 4px 0; max-width: 520px; margin-left: auto; }
.rate-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line2); }
.rate-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; font-size: 13px; }
.rate-name em { font-style: normal; color: var(--muted); font-size: 12px; }
.rate-btns { display: flex; gap: 4px; }
.rb { width: 30px; height: 26px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
.rb.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.grid-wrap { overflow-x: auto; }
table.grid { border-collapse: collapse; font-size: 12.5px; }
table.grid th, table.grid td { border: 1px solid var(--line2); padding: 4px 6px; text-align: center; }
table.grid th { font-weight: 500; color: var(--muted); background: #fafafa; }
.gh { writing-mode: vertical-rl; max-height: 110px; overflow: hidden; margin: 0 auto; }
td.gd { text-align: left !important; white-space: nowrap; }
td.gv { width: 30px; font-weight: 600; }
td.v1 { background: #dbeafe; } td.v2 { background: #eff6ff; } td.v3 { background: #f9fafb; } td.v4 { background: #fef3c7; } td.v5 { background: #fde68a; }
.hint-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; margin-top: 8px; }
.ai-bubble { background: var(--mock-soft); border: 1px dashed #c4b5fd; border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
.ai-head { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mock); font-weight: 600; margin-bottom: 4px; }
.ai-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--mock); color: #fff; font-size: 9.5px; display: grid; place-items: center; }
.ai-line { font-size: 13px; padding: 2px 0; }

/* ② 分堆 */
.tray { background: #fff; border: 1px dashed #cbd5e1; border-radius: var(--r); padding: 10px; }
.tray-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.piles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.pile-col { border-radius: var(--r); padding: 10px; min-height: 160px; transition: background .1s, outline .1s; }
.piles .pile-col { background: #fff; border: 1px solid var(--line); }
.pile-col.p-good { border-top: 4px solid var(--good); } .pile-col.p-mid { border-top: 4px solid var(--mid); } .pile-col.p-bad { border-top: 4px solid var(--bad); }
.pile-col.over { outline: 2px dashed var(--accent); background: var(--accent-soft) !important; }
.pile-title { font-weight: 600; margin-bottom: 8px; }
.pile-items { display: flex; flex-direction: column; gap: 8px; }
.tray .pile-items { display: grid; }
.pile-card { cursor: grab; padding: 8px; }
.pile-card.dragging { opacity: .4; }
.pile-card .thumb { width: 34px; height: 34px; font-size: 11px; }
.pile-ctl { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
.pb { border: 1px solid var(--line); background: #fff; border-radius: 6px; font-size: 12px; padding: 0 7px; cursor: pointer; line-height: 1.7; }
.pb.p-good.on { background: var(--good); color: #fff; border-color: var(--good); }
.pb.p-mid.on { background: var(--mid); color: #fff; border-color: var(--mid); }
.pb.p-bad.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.cbadge { font-size: 11px; border-radius: 5px; padding: 0 5px; margin-left: auto; }
.cbadge.ok { background: var(--good-soft); color: var(--good); } .cbadge.bad { background: var(--bad-soft); color: var(--bad); }
.reason { width: 100%; margin-top: 5px; font-size: 12px !important; }
.drop-hint { color: var(--faint); font-size: 12.5px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; padding: 22px 0; }
.inc-row { border-top: 1px solid #fde68a; padding: 10px 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.inc-row:first-of-type { border-top: none; }
.pile-btn.on { outline: 2px solid currentColor; }

/* ③ 规则卡片 */
.rule-list { display: flex; flex-direction: column; gap: 12px; }
.rule-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; transition: box-shadow .3s; }
.rule-card.expert { border-left: 4px solid var(--accent); }
.rule-card.default { border-left: 4px solid #d1d5db; }
.rule-card.off { opacity: .6; }
.rule-card.flash { box-shadow: 0 0 0 3px #93c5fd; }
.rc-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.rc-grid { display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; font-size: 13px; }
.rc-k { color: var(--faint); font-size: 12px; padding-top: 2px; }
.cond { display: inline-block; background: #f9fafb; border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; font-size: 12.5px; }
.cond.exc { background: #f0fdf4; border-color: #bbf7d0; }
.act.penalty { color: var(--mid); font-weight: 600; } .act.veto { color: var(--bad); font-weight: 600; }
.rc-preview { border-top: 1px solid var(--line2); margin-top: 10px; padding-top: 8px; font-size: 13px; }
.sub-dist { margin-left: 8px; }
.sub-dist .chip { margin-right: 3px; }

/* ④ 纠错 */
.repair-layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 14px; align-items: start; }
.queue { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 6px; position: sticky; top: 140px; max-height: calc(100vh - 160px); overflow-y: auto; }
.q-head { font-size: 12px; color: var(--muted); padding: 8px 8px 4px; display: flex; justify-content: space-between; }
.count { font-size: 11px; background: #f3f4f6; border-radius: 999px; padding: 0 7px; color: var(--muted); }
.count.bad { background: var(--bad-soft); color: var(--bad); }
.q-row { padding: 7px 8px; border-radius: 8px; cursor: pointer; border-left: 3px solid transparent; }
.q-row:hover { background: #f9fafb; }
.q-row.on { background: var(--accent-soft); }
.q-row.bad { border-left-color: var(--bad); } .q-row.ok { border-left-color: var(--good); } .q-row.acc { border-left-color: #d1d5db; }
.q-name { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-v { font-size: 11.5px; color: var(--muted); }
.tag-def { font-size: 10.5px; background: var(--mock-soft); color: var(--mock); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
.rd-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: stretch; }
.rd-top .item .item-name { white-space: normal; }
.rd-verdicts { display: flex; gap: 10px; }
.rv { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; min-width: 120px; max-width: 200px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ask-box { background: #fff; border: 2px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin: 14px 0; display: flex; flex-direction: column; gap: 10px; }
.ask-q { font-size: 15.5px; }
.trace { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.trace-row { padding: 6px 8px; background: #fafafa; border-radius: 8px; }
.trace-row.exc { background: #f0fdf4; }
table.feat { border-collapse: collapse; font-size: 12.5px; width: 100%; }
table.feat th, table.feat td { border-bottom: 1px solid var(--line2); padding: 4px 8px; text-align: left; }
table.feat tr.hl td { background: #fffbeb; font-weight: 600; }
.success-box { background: var(--good-soft); color: #166534; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
.all-good { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 30px; text-align: center; }
.all-good .big { font-size: 17px; color: var(--good); font-weight: 600; margin-bottom: 6px; }

/* ⑤ 矩阵 */
.matrix-wrap { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 4px; width: 100%; }
table.matrix th { font-weight: 600; font-size: 13px; text-align: left; padding: 4px 8px; }
table.matrix thead th { text-align: center; }
td.mc { border-radius: 8px; padding: 8px; text-align: center; min-width: 110px; height: 64px; font-size: 12px; }
td.mc.none { background: #f9fafb; color: #d1d5db; }
td.mc.gap { background: #fef3c7; border: 1px dashed #f59e0b; cursor: pointer; }
td.mc.covered { background: #dcfce7; border: 1px solid #86efac; cursor: pointer; }
td.mc.sel { outline: 3px solid var(--accent); }
td.mc:hover:not(.none) { filter: brightness(.97); }
.mc-n { font-size: 17px; font-weight: 700; color: #166534; }
.mc-gap { font-weight: 600; color: #b45309; }
.mc-sub { color: #4b5563; } .mc-sub2 { color: var(--faint); font-size: 11px; }
.map-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; }
.kw-table { max-height: 300px; overflow-y: auto; border: 1px solid var(--line2); border-radius: 8px; padding: 6px; }
.kw-row { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; border-bottom: 1px solid var(--line2); }
.kw-row .chip { flex: none; }
table.kv { border-collapse: collapse; width: 100%; }
table.kv th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 10px 4px 0; vertical-align: top; white-space: nowrap; font-size: 12.5px; }
table.kv td { padding: 4px 0; font-size: 13px; }

/* 右侧契约预览 */
.rp-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line2); }
.rp-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line2); }
.metric { background: #f9fafb; border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; }
.metric b { font-size: 17px; }
.metric span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.rp-scroll { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
.rp-scroll details { border-bottom: 1px solid var(--line2); padding: 6px 0; }
.rp-scroll summary { cursor: pointer; font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; padding: 4px 2px; list-style: none; }
.rp-scroll summary::-webkit-details-marker { display: none; }
.rp-scroll summary::before { content: '▸'; color: var(--faint); margin-right: 6px; transition: transform .15s; }
.rp-scroll details[open] summary::before { transform: rotate(90deg); }
.rp-scroll summary span:first-child { flex: 1; }
.sec-body { padding: 4px 0; }
.sub-head { font-size: 11.5px; color: var(--faint); margin: 8px 0 4px; }
.rp-rule { padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line2); margin-bottom: 6px; cursor: pointer; }
.rp-rule:hover { border-color: #bfdbfe; }
.rp-rule.expert { border-left: 3px solid var(--accent); }
.rp-rule.off { opacity: .55; }
.rp-rule-top { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.hitc { margin-left: auto; font-size: 11px; color: var(--muted); }
.rp-rule-text { font-size: 12.5px; margin-top: 2px; }
.rp-dim { padding: 6px 2px; border-bottom: 1px dashed var(--line2); font-size: 12.5px; }
.rp-dim > div:first-child { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.rp-case { display: flex; align-items: center; gap: 4px; padding: 4px 6px; font-size: 12px; border-radius: 6px; cursor: pointer; border-left: 3px solid transparent; }
.rp-case:hover { background: #f9fafb; }
.rp-case.ok { border-left-color: var(--good); } .rp-case.bad { border-left-color: var(--bad); background: #fff7f7; } .rp-case.acc { border-left-color: #d1d5db; }
.case-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-v { white-space: nowrap; color: var(--muted); }
.rp-conf { font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.rp-conf:hover { background: #f9fafb; }
.rp-log { font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line2); }
.rp-foot { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); background: #fafafa; }

/* 弹窗 */
.overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, .45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; z-index: 50; overflow-y: auto; }
.modal { background: #fff; border-radius: 14px; width: 560px; max-width: 100%; box-shadow: 0 20px 50px rgba(0, 0, 0, .2); display: flex; flex-direction: column; }
.modal.wide { width: 820px; } .modal.xwide { width: 1120px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line2); }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-body { padding: 14px 18px; max-height: calc(100vh - 200px); overflow-y: auto; }
.modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line2); background: #fafafa; border-radius: 0 0 14px 14px; }
.modal-foot > .btn:first-child { margin-left: auto; }
.field-label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
pre.yaml { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 14px; font-size: 12px; overflow: auto; max-height: 60vh; white-space: pre; }
.item-detail { display: flex; gap: 14px; align-items: flex-start; }
.ed-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); max-height: calc(100vh - 210px); }
.ed-form { padding: 6px 18px 14px; overflow-y: auto; border-right: 1px solid var(--line2); }
.ed-form section { border-bottom: 1px solid var(--line2); padding-bottom: 10px; }
.ed-form section:last-child { border-bottom: none; }
.ed-row { display: grid; grid-template-columns: 40px 1fr; gap: 6px; align-items: start; margin: 4px 0; }
.ed-row label { font-size: 12.5px; color: var(--muted); padding-top: 4px; }
.chipset { display: flex; flex-wrap: wrap; }
.cond-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.unit { font-size: 12px; color: var(--muted); min-width: 24px; }
.radio { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.req { font-size: 11px; color: var(--bad); font-weight: 400; margin-left: 4px; }
.ed-target { background: #fafafa; border-radius: 10px; padding: 8px; margin: 10px 0 4px; display: flex; flex-direction: column; gap: 6px; }
.ed-preview { padding: 12px 18px; overflow-y: auto; background: #fcfcfd; font-size: 13px; }
.backtrans { background: #fff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
.pv-stat { margin: 8px 0 4px; } .pv-stat b { font-size: 20px; color: var(--accent); }
.bars { margin: 6px 0; }
.bar-row { display: grid; grid-template-columns: 120px 1fr 30px; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4b5563; }
.bar { height: 8px; background: #93c5fd; border-radius: 4px; display: block; min-width: 3px; }
.bar-n { color: var(--muted); }
.reg-box { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 10px 0; }
.fix-row { font-size: 12.5px; color: #166534; margin: 2px 0; }
.flip-box { background: var(--bad-soft); border: 1px solid #fca5a5; border-radius: 10px; padding: 10px 12px; margin: 10px 0; color: #7f1d1d; }
.flip-row { font-size: 12.5px; margin: 3px 0; }
.tgt-status { border-radius: 8px; padding: 6px 10px; margin: 6px 0; font-size: 13px; }
.tgt-status.ok { background: var(--good-soft); color: #166534; } .tgt-status.bad { background: #fff7ed; color: #9a3412; }
.force { display: flex; align-items: center; gap: 6px; color: var(--bad); }
#ed-foot .row { margin-left: auto; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 100; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); max-width: 70vw; }
.toast.err { background: var(--bad); } .toast.ok { background: #166534; } .toast.warn { background: #b45309; }

/* 空场景 */
.empty-state { max-width: 640px; margin: 30px auto; text-align: center; }
.es-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-size: 28px; display: grid; place-items: center; margin: 0 auto 10px; }
.slot-form { text-align: left; }
.slot-form .row { margin-top: 14px; }
.steps.disabled { justify-content: center; opacity: .45; margin-top: 10px; }

/* 窄屏 */
@media (max-width: 1180px) {
  #app { grid-template-columns: 200px minmax(0, 1fr) 0; }
  #right { position: fixed; right: 0; top: 0; bottom: 0; width: 330px; z-index: 30; box-shadow: -10px 0 30px rgba(0, 0, 0, .12); }
  .screen { padding: 16px; }
  .main-head { padding: 14px 16px 0; }
}
@media (max-width: 900px) {
  .triad-row, .piles { grid-template-columns: 1fr; }
  .repair-layout { grid-template-columns: 1fr; }
  .queue { position: static; max-height: none; }
  .ed-grid { grid-template-columns: 1fr; max-height: none; }
}
/* 调整 */
.in-pile { display: none; margin-left: 4px; }
.piles .pile-card .thumb, .piles .pile-card .chips { display: none; }
.piles .pile-card .in-pile { display: inline; }
.piles .pile-card .item-name { font-size: 13px; }
.piles .pile-card .item-meta { margin-bottom: 2px; }
.rd-top { display: flex; flex-wrap: wrap; }
.rd-top > .item { flex: 1 1 280px; }
.rd-verdicts { flex: 0 0 auto; }
@media (max-width: 1400px) { .sb-l { display: none; } .step { padding: 8px 9px 9px; } }
#right > .empty-note { padding: 12px 16px; }
.ed-grid { max-height: none; }
.ed-form, .ed-preview { max-height: calc(100vh - 220px); }
@media (max-width: 900px) { .ed-form, .ed-preview { max-height: none; } }

/* ================= v0.2 层（叠在原 style.css 之上） =================
   去拥挤共享层：字号 5 级（12/13/14/16/20）· 间距 4 的倍数 · 少边框 · 「模拟/示例」纯文字小标记 · 矩阵浅底
   外壳：94px 头部（场景行 48 + 步骤页签 46）· 56px 底部契约条 · 可停靠契约面板（右侧默认 / 底部 ≤50vh）
   强调色：蓝 #2563eb（原 indigo 改掉）；紫色只留给「模拟」语义。 */
:root {
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --bg: #f7f8fa; --line: #e7e9ee; --line2: #f0f2f5; --text: #1d2433; --muted: #5f6b7d; --faint: #8f99a8; --r: 12px;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff6ff; --accent-ring: #bfdbfe;
  --head-h: 94px; --bar-h: 56px;
  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 320ms; --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-in: cubic-bezier(.4, 0, 1, 1);
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .06); --shadow-pop: 0 12px 32px rgba(16, 24, 40, .16);
}
body { font-size: var(--fs-md); line-height: 1.6; background: var(--bg); }
.small, .btn.small, .item-meta, .quote, .why, .cond, .rp-rule-text, .rp-log, .rp-case, .rp-conf, .q-name, table.grid, table.feat, .ai-line, .intro-body, .pb { font-size: var(--fs-sm); }
.tiny, .badge, .chip, .mock-tag, .seed-tag, .rid, .count, .tag-def, .cbadge, .scope-k, .rc-k, .q-v, .hitc, .sub-head, .metric span, .mc-sub2, .q-head, .vd { font-size: var(--fs-xs); }
h4, .ask-q, .modal-head h3 { font-size: var(--fs-lg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.btn { border-radius: 8px; transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast); }
.btn.primary:hover { background: var(--accent-hover); }
.link-btn { border: none; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 6px; font-size: var(--fs-sm); }
.link-btn:hover { text-decoration: underline; }
/* 标签降噪：模拟/示例 = 纯文字小标记（信息不删，只是不抢眼） */
.mock-tag { border: none; background: none; padding: 0 2px; color: var(--mock); opacity: .9; }
.mock-tag::before { content: '◇'; margin-right: 2px; font-size: 10px; }
.seed-tag { background: none; padding: 0 2px; color: var(--seed); }
.seed-tag::before { content: '●'; margin-right: 2px; font-size: 8px; vertical-align: 1px; }
.badge { background: transparent; padding: 0 4px; }
.b-expert { background: #eff6ff; color: #1e40af; padding: 0 6px; } .b-warn { background: var(--bad-soft); padding: 0 6px; } .b-ver { background: var(--accent-soft); padding: 0 8px; }
/* 卡片：去边框，用浅底 + 极轻阴影分层 */
.card { border: none; box-shadow: var(--shadow-1); padding: var(--s4) var(--s5); margin: var(--s4) 0; border-radius: var(--r); }
.card-head { margin-bottom: var(--s3); }
.item { border-color: var(--line2); }
.screen { max-width: 1180px; margin: 0 auto; padding: var(--s5) var(--s5) var(--s6); }
.toolbar { margin: var(--s3) 0; gap: var(--s2); }
.tc-n { opacity: .7; font-size: var(--fs-xs); }

/* ---------- 外壳网格 ---------- */
#app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) 0; grid-template-rows: var(--head-h) minmax(0, 1fr) 0 var(--bar-h);
  grid-template-areas: "head head" "main side" "bottom bottom" "bar bar"; }
body.cp-open.dock-right #app { grid-template-columns: minmax(0, 1fr) var(--cpw, 440px); }
body.cp-open.dock-bottom #app { grid-template-rows: var(--head-h) minmax(0, 1fr) var(--cph, 42vh) var(--bar-h); }
#head { grid-area: head; background: #fff; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20; min-width: 0; }
#main { grid-area: main; overflow-y: auto; min-width: 0; min-height: 0; scroll-padding-top: 16px; }
#contract { grid-area: side; min-width: 0; min-height: 0; background: #fff; display: flex; flex-direction: column; position: relative; overscroll-behavior: contain; }
#contract[hidden] { display: none; }
body.dock-right #contract { border-left: 1px solid var(--line); animation: cp-in-r var(--dur) var(--ease-out); }
body.dock-bottom #contract { grid-area: bottom; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(16, 24, 40, .06); animation: cp-in-b var(--dur) var(--ease-out); }
@keyframes cp-in-r { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cp-in-b { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
#cbar { grid-area: bar; z-index: 20; }
body.resizing { cursor: col-resize; user-select: none; } body.resizing.dock-bottom { cursor: row-resize; }
body.resizing #app { transition: none; }

/* ---------- 头部：场景行 48 + 步骤页签 46 = 94 ---------- */
.hd-row { height: 48px; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s5); min-width: 0; }
.brand-v2 { display: flex; align-items: center; gap: var(--s2); color: var(--text); font-size: var(--fs-md); flex: none; padding-right: var(--s3); border-right: 1px solid var(--line); }
.brand-v2 .logo { width: 24px; height: 24px; border-radius: 7px; font-size: 13px; background: var(--accent); }
.hd-note { flex: none; }
details.pop { position: relative; min-width: 0; }
details.pop > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); color: #475467; padding: 4px 8px; border-radius: 8px; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.pop > summary::-webkit-details-marker { display: none; }
details.pop > summary:hover, details.pop[open] > summary { background: #f2f4f7; }
details.pop > summary i { font-style: normal; color: var(--faint); margin-right: 4px; }
.pop-caret { color: var(--faint); font-size: 11px; }
.pop-body { position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; background: #fff; border-radius: 12px; box-shadow: var(--shadow-pop); padding: var(--s3) var(--s4); width: 420px; white-space: normal; animation: pop-in var(--dur-fast) var(--ease-out); }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.sess-pop > summary { color: var(--text); padding: 4px 8px 4px 6px; }
.sess-pop h1 { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
.sess-pop .pop-body { width: 340px; padding: var(--s2); }
.pop-label { font-size: var(--fs-xs); color: var(--faint); padding: var(--s1) var(--s2) var(--s2); }
.sess { display: flex; width: 100%; gap: var(--s3); align-items: center; padding: var(--s2); border-radius: 8px; cursor: pointer; border: none; background: none; text-align: left; color: var(--text); }
.sess:hover { background: #f5f6f8; } .sess.active { background: var(--accent-soft); }
.sess > span:nth-child(2) { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.sess-icon { width: 28px; height: 28px; border-radius: 7px; background: #98a2b3; color: #fff; display: grid; place-items: center; font-size: var(--fs-sm); flex: none; }
.sess.active .sess-icon { background: var(--accent); }
.sess-name { font-size: var(--fs-md); color: var(--text); font-weight: 500; }
.sess-sub { font-size: var(--fs-xs); color: var(--muted); }
.sess-on { font-size: var(--fs-xs); color: var(--accent); }
.pop-actions { display: flex; gap: var(--s2); padding: var(--s2); border-top: 1px solid var(--line2); margin-top: var(--s1); }
.pop-note { padding: 0 var(--s2) var(--s1); }
/* 步骤页签：可任意点击（不是线性向导），每个页签带真实状态 */
.hd-steps { height: 46px; padding: 0 var(--s4); display: flex; align-items: stretch; }
.steps-v2 { display: flex; align-items: stretch; gap: var(--s1); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.st { display: flex; align-items: center; gap: var(--s2); border: none; background: none; cursor: pointer; padding: 0 var(--s3); color: #475467; white-space: nowrap; position: relative; font-size: var(--fs-md); border-radius: 8px 8px 0 0; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast); }
.st:hover { background: #f5f6f8; color: var(--text); }
.st::after { content: ''; position: absolute; left: var(--s3); right: var(--s3); bottom: 0; height: 2px; border-radius: 2px; background: transparent; transition: background-color var(--dur) var(--ease-out); }
.st.on { color: var(--accent); } .st.on::after { background: var(--accent); }
.st-ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 650; border: 1.5px solid #cfd4dc; color: var(--muted); flex: none; background: #fff; }
.st-done .st-ico { background: #ecfdf3; border-color: #75e0a7; color: #067647; }
.st-prog .st-ico { border-color: #f5b85b; color: #b54708; }
.st-alert .st-ico { border-color: #f97066; color: #b42318; }
.st.on .st-ico { box-shadow: 0 0 0 3px var(--accent-ring); }
.st-l { font-weight: 600; }
.st-s { font-size: var(--fs-xs); color: var(--faint); display: inline-flex; align-items: center; gap: var(--s1); }
.st-done .st-s { color: #067647; }
.st-prog .st-s { color: #b54708; }
.st-alert .st-s { color: #b42318; }
.st-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 650; color: #fff; background: #f79009; line-height: 1; }
.st-alert .st-n { background: #d92d20; }
.steps-v2.disabled { opacity: .45; } .steps-v2.disabled .st { cursor: default; }

/* ---------- 底部契约条 56px ---------- */
#cbar { height: var(--bar-h); display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s5); background: #fff; border-top: 1px solid var(--line); font-size: var(--fs-sm); white-space: nowrap; min-width: 0; overflow: hidden; }
.cb-title { display: flex; align-items: baseline; gap: 6px; border: none; background: none; cursor: pointer; padding: 6px 8px; border-radius: 8px; color: var(--text); flex: none; }
.cb-title:hover { background: #f2f4f7; } .cb-title[aria-expanded="true"] { background: var(--accent-soft); }
.cb-caret { color: var(--faint); }
.cb-m { color: var(--muted); flex: none; } .cb-m b { font-size: var(--fs-lg); color: var(--text); } .cb-m b.ok { color: var(--good); } .cb-m b.warn { color: var(--mid); }
.cb-sep { width: 1px; height: 20px; background: var(--line); flex: none; }

function yamlStr(v) { if (v == null) return '~'; if (typeof v === 'number' || typeof v === 'boolean') return String(v); return JSON.stringify(String(v)); }
function contractYaml(s = S()) {

  L.push('# Crucible 契约草稿（原型导出，YAML 风格文本，非引擎可加载格式）');
  L.push(`# 场景：${spec.scenario_name}  草稿 v${spec.draft_version}  导出于 ${spec.exported_at}`);
  L.push('# origin=common_sense_default 的规则是“模拟 AI 新手”的脚本，不是专家意见；example_seed=true 为演示示例');
  L.push(`scenario_id: ${yamlStr(spec.scenario_id)}`);
  L.push(`draft_version: ${spec.draft_version}`);
  L.push('scoring: { base: 1.0, good: ">= 0.8", mid: "0.55-0.8", bad: "< 0.55 or gate" }');
  L.push('rules:');
  spec.rules.forEach(r => {
    L.push(`  - id: ${r.id}`);
    L.push(`    origin: ${yamlStr(r.origin)}${r.example_seed ? '   # 示例' : ''}`);
    L.push(`    active: ${r.active}`);
    L.push(`    scope: { 来源: [${r.scope.来源.join(', ')}], 品类: [${r.scope.品类.join(', ')}], 子类: [${r.scope.子类.join(', ')}] }`);
    L.push(`    when: [${r.when.map(yamlStr).join(', ')}]`);
    L.push(`    enforcement: ${r.enforcement}`);
    if (r.penalty != null) L.push(`    penalty: ${r.penalty}`);
    if (r.unless.length) { L.push('    unless:'); r.unless.forEach(u => { L.push(`      - cond: ${yamlStr(u.cond)}`); L.push(`        quote: ${yamlStr(u.quote)}`); }); }
    if (r.quote) L.push(`    quote: ${yamlStr(r.quote)}`);
    if (r.common_sense_reason) L.push(`    common_sense_reason: ${yamlStr(r.common_sense_reason)}`);
    L.push(`    hit_count: ${r.hit_count}`);
  });
  L.push('dimensions:');
  spec.dimensions.forEach(d => { L.push(`  - id: ${d.id}`); L.push(`    construct: ${yamlStr(d.construct)}`); L.push(`    quote_like: ${yamlStr(d.quote_like)}`); L.push(`    quote_contrast: ${yamlStr(d.quote_contrast)}`); L.push(`    rated_items: ${Object.keys(d.ratings).length}`); });

  return L.join('\n') + '\n';
}

const TABS = [
  { id: 'triad', n: '①', label: '三元比较' }, { id: 'pile', n: '②', label: '分堆排序' }, { id: 'rules', n: '③', label: '规则卡片' },
  { id: 'repair', n: '④', label: '纠错循环' }, { id: 'matrix', n: '⑤', label: '覆盖矩阵' },

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function aiBubble(lines, title = 'AI 追问') { return `<div class="ai-bubble"><div class="ai-head"><span class="ai-dot">AI</span>${esc(title)} ${mockTag('模拟 · 模板生成')}</div>${lines.map(l => `<div class="ai-line">${l}</div>`).join('')}</div>`; }

/* ---------- ① 三元比较 ---------- */
function newTriad(s, mode, cell) {
  let pool = ITEMS, forced = null;
  if (mode === 'samecat') { const cats = CATS.filter(c => ITEMS.filter(i => i.cat === c).length >= 3); const c = cats[Math.floor(Math.random() * cats.length)]; pool = ITEMS.filter(i => i.cat === c); }
  else if (mode === 'samesub') { const subs = [...new Set(ITEMS.map(i => i.cat + '|' + i.sub))].filter(k => new Set(ITEMS.filter(i => i.cat + '|' + i.sub === k).map(i => i.sku)).size >= 3); const k = subs[Math.floor(Math.random() * subs.length)]; pool = ITEMS.filter(i => i.cat + '|' + i.sub === k); }
  else if (mode === 'crosssrc') { const cats = CATS.filter(c => new Set(ITEMS.filter(i => i.cat === c).map(i => i.source)).size >= 2); const c = cats[Math.floor(Math.random() * cats.length)]; const byS = {}; ITEMS.filter(i => i.cat === c).forEach(i => (byS[i.source] = byS[i.source] || []).push(i)); const picks = shuffle(Object.values(byS)).flatMap(l => distinctSku(l, 2)); pool = picks.length >= 3 ? picks : ITEMS.filter(i => i.cat === c); }

    if (c) { pool = ITEMS.filter(i => i.cat === c.cat && i.source === c.src); if (new Set(pool.map(i => i.sku)).size < 3) { const own = distinctSku(pool, 3); forced = own.concat(distinctSku(ITEMS.filter(i => i.cat === c.cat && i.source !== c.src && !own.some(o => o.sku === i.sku)), 3 - own.length)); } } // v0.2：格子里的商品不足 3 个时先全部放进来，再用同品类其他来源补齐

  ui.triadMsg = null;
}
function pearson(a, b) { const n = a.length; const ma = a.reduce((x, y) => x + y, 0) / n, mb = b.reduce((x, y) => x + y, 0) / n; let num = 0, da = 0, db = 0; for (let i = 0; i < n; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; } return da && db ? num / Math.sqrt(da * db) : 0; }

  ${intro('哪两个更像？第三个哪里不同？', '从真实商品里抽 3 个。你说出的区别会原样成为评价<b>维度</b>（方格法 / repertory grid）——维度用你的词，不由设计者预设。然后用这个维度给几个商品快速打分。')}
  <div class="toolbar"><span class="muted small">抽样方式：</span>${modes.map(([k, l]) => `<button class="tchip ${s.triad.mode === k ? 'on' : ''}" data-act="triad-mode" data-mode="${k}">${l}</button>`).join('')}<span class="spacer"></span><button class="btn small" data-act="triad-new">换一组</button></div>
  <div class="triad-row">${tri.map(it => itemCard(it, { cls: 'triad-card ' + (odd ? (odd === it.code ? 'odd' : 'pair') : ''), act: 'triad-odd', big: true, extra: `<div class="triad-tag">${odd ? (odd === it.code ? '不一样的那个' : '相像的一对') : '点我＝“这个不一样”'}</div>` })).join('')}</div>

      <div class="tf-row"><label>那两个像在哪？<span class="muted small">（用你自己的话，不用想“标准答案”）</span></label><input class="input" id="triad-like" placeholder="例如：…"></div>

/* ---------- ② 分堆排序 ---------- */
function pileInconsistencies(s) {
  const placed = s.pile.batch.filter(c => s.labels[c] && ITEM[c]).map(c => ITEM[c]);
  const out = [];
  for (let i = 0; i < placed.length; i++) for (let j = i + 1; j < placed.length; j++) {
    const a = placed[i], b = placed[j];
    if (a.cat !== b.cat || a.sub !== b.sub || a.price == null || b.price == null) continue;
    const va = s.labels[a.code].v, vb = s.labels[b.code].v; if (va === vb) continue;
    if (Math.abs(a.price - b.price) > Math.max(0.5, 0.25 * Math.max(a.price, b.price))) continue;
    const [x, y] = VERDICT_ORDER[va] <= VERDICT_ORDER[vb] ? [a, b] : [b, a];
    out.push({ key: [a.code, b.code].sort().join('|'), a: x, b: y });
  }
  return out;
}
function newPileBatch(s) {
  const unl = ITEMS.filter(i => !s.labels[i.code]);
  const subKeys = shuffle([...new Set(unl.map(i => i.cat + '|' + i.sub))].filter(k => new Set(unl.filter(i => i.cat + '|' + i.sub === k).map(i => i.sku)).size >= 3));
  const pick = [];
  if (subKeys[0]) pick.push(...distinctSku(unl.filter(i => i.cat + '|' + i.sub === subKeys[0]), 3));
  if (subKeys[1]) pick.push(...distinctSku(unl.filter(i => i.cat + '|' + i.sub === subKeys[1]), 2));
  const rest = unl.filter(i => !pick.includes(i));
  for (const src of shuffle(SOURCES)) { const c = distinctSku(rest.filter(i => i.source === src && !pick.some(p => p.sku === i.sku)), 1); pick.push(...c); }
  pick.push(...distinctSku(rest.filter(i => !pick.some(p => p.sku === i.sku)), 9 - pick.length));
  s.pile.batch = shuffle(pick.slice(0, 9)).map(i => i.code);
}

/* ---------- ③ 规则卡片 ---------- */
function scopeChips(r) {

/* ---------- ④ 纠错循环 ---------- */
function suggestAmount(score, target) {
  for (const a of [0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6]) { const x = score - a; const v = x >= 0.8 ? 'good' : x >= 0.55 ? 'mid' : 'bad'; if (v === target) return { type: 'penalty', amount: a }; }
  return target === 'bad' ? { type: 'veto', amount: 0.3 } : { type: 'penalty', amount: 0.3 };
}

/* ---------- ⑤ 覆盖矩阵 ---------- */
function matrixData(s) {
  const cells = []; let gapCount = 0, withItems = 0;
  for (const cat of CATS) for (const src of SOURCES) {
    const items = ITEMS.filter(i => i.cat === cat && i.source === src);
    const applies = r => r.active && (!r.scope.sources.length || r.scope.sources.includes(src)) && (!r.scope.cats.length || r.scope.cats.includes(cat));
    const exp = s.rules.filter(r => r.origin === 'expert' && applies(r));
    const specific = exp.filter(r => r.scope.sources.length && r.scope.cats.length);
    const generic = exp.filter(r => !specific.includes(r));
    const def = s.rules.filter(r => r.origin === 'default' && applies(r));
    const labeled = items.filter(i => s.labels[i.code]).length;
    if (items.length) { withItems++; if (!specific.length) gapCount++; }
    cells.push({ cat, src, items, specific, generic, def, labeled });
  }
  return { cells, gapCount, withItems };
}

      </div>

        <div class="card"><div class="card-head"><b>区分特征</b><span class="muted small">这个商品 vs 同品类里契约已判对的 ${sameScopeOk.length} 个案例（自动计算，非 AI）</span></div>
          ${sameScopeOk.length ? `<table class="feat"><thead><tr><th>字段</th><th>这个商品</th><th>其余案例范围</th><th></th></tr></thead><tbody>${featRows}</tbody></table>` : '<div class="muted small">同品类还没有判对的案例——新规则不会翻转已知案例，但也缺少对照。</div>'}

/* ---------- ⑤ 覆盖矩阵：空格子 → 去补样本 → ① ---------- */

/* ---------- 步骤状态：全部由真实数据推出 ---------- */
function stepStatus(s) {
  const lab = labeledCodes(s).length;
  const batch = s.pile.batch.filter(c => ITEM[c]); const un = batch.filter(c => !s.labels[c]).length;
  const incons = pileInconsistencies(s).filter(p => !s.pile.notes[p.key]).length;
  const expert = s.rules.filter(r => r.origin === 'expert');
  const zero = s.rules.filter(r => r.active && hitSplit(r).hit.length === 0).length;
  const untraced = expert.filter(r => !r.quote).length;
  const dis = disagreements(s).length; const gaps = matrixData(s).gapCount;
  const st = {};
  st.triad = s.dims.length ? { k: 'done', sub: `维度 ${s.dims.length}` } : s.triad.odd ? { k: 'prog', sub: '进行中' } : { k: 'todo', sub: '未开始' };
  const pend = un + incons;
  st.pile = !lab && !pend ? { k: 'todo', sub: '未开始' } : pend ? { k: 'prog', sub: '进行中', n: pend, tip: [un ? `待分 ${un}` : '', incons ? `不一致 ${incons}` : ''].filter(Boolean).join(' · ') } : { k: 'done', sub: `已标注 ${lab}` };
  st.rules = !expert.length ? { k: 'todo', sub: '还没有专家规则' } : (zero + untraced) ? { k: 'prog', sub: `专家 ${expert.length}`, n: zero + untraced, tip: [zero ? `0 命中 ${zero}` : '', untraced ? `未溯源 ${untraced}` : ''].filter(Boolean).join(' · ') } : { k: 'done', sub: `专家规则 ${expert.length}` };
  st.repair = !lab ? { k: 'todo', sub: '还没有标注' } : dis ? { k: 'alert', sub: '分歧', n: dis, tip: `${dis} 个案例契约与你不一致` } : { k: 'done', sub: '全部一致' };
  st.matrix = gaps ? { k: 'prog', sub: '未聊到', n: gaps, tip: `${gaps} 个有商品的格子还没有专属规则` } : { k: 'done', sub: '全部聊到' };
  return st;
}
function stepsHtml(s) {
  if (s.empty) return `<nav class="steps-v2 disabled" aria-label="步骤（空场景不可用）">${TABS.map((t, i) => `<span class="st st-todo"><span class="st-ico">${i + 1}</span><span class="st-l">${t.label}</span></span>`).join('')}</nav>`;
  const st = stepStatus(s);
  return `<nav class="steps-v2" role="tablist" aria-label="五个步骤（可任意顺序进入）">${TABS.map((t, i) => {
    const x = st[t.id], on = state.tab === t.id;
    const label = { done: '已完成', prog: '进行中', alert: '有待处理', todo: '未开始' }[x.k];
    return `<button class="st st-${x.k} ${on ? 'on' : ''}" role="tab" id="st-${t.id}" aria-selected="${on}" tabindex="${on ? 0 : -1}" data-act="tab" data-tab="${t.id}" title="${label}${x.tip ? '：' + x.tip : ''}" data-status="${x.k}">
      <span class="st-ico" aria-hidden="true">${x.k === 'done' ? '✓' : i + 1}</span><span class="st-l">${t.label}</span>
      <span class="st-s">${x.sub}${x.n ? `<b class="st-n">${x.n}</b>` : ''}</span></button>`;
  }).join('')}</nav>`;
}
function renderSteps() { const n = $('#steps-slot'); if (n) n.innerHTML = stepsHtml(S()); }

/* ---------- 契约：底部 56px 条 + 停靠面板（规则 | 维度 | 样本 | 待办 | 记录） ---------- */
function contractParts(s) {
  const cs = caseStatus(s);
  const defaultOnly = s.rules.filter(r => r.origin === 'default').map(r => Object.assign({}, r, { exceptions: [], active: true }));
  const agreeDefault = cs.filter(c => evaluate(c.it, defaultOnly).verdict === c.label).length;
  const expert = s.rules.filter(r => r.origin === 'expert'), def = s.rules.filter(r => r.origin === 'default');
  const ruleRow = r => `<div class="rp-rule ${r.active ? '' : 'off'} ${r.origin} ${state.tab === 'rules' && V().ruleSel === r.id ? 'on' : ''}" data-act="goto-rule" data-id="${r.id}" role="button" tabindex="0">
      <div class="rp-rule-top"><span class="rid">${r.id}</span>${originBadge(r)}${r.active ? '' : '<span class="badge b-off">已停用</span>'}<span class="hitc">命中 ${hitSplit(r).hit.length}</span></div>
      <div class="rp-rule-text">${esc(ruleOneLine(r))}</div>
      ${r.origin === 'expert' ? (r.quote ? `<div class="quote">“${esc(r.quote)}”</div>` : '<div class="quote missing">（没有原话，无法溯源）</div>') : `<div class="why">常识理由${mockTag('模拟 AI')}：${esc(r.why)}</div>`}
      ${r.exceptions.map(e => `<div class="quote small">例外「${esc(condText(e))}」${e.quote ? '：“' + esc(e.quote) + '”' : '<span class="missing">（无原话）</span>'}</div>`).join('')}
    </div>`;
  const dis = cs.filter(c => !c.agree && !c.accepted), acc = cs.filter(c => c.accepted);
  const incons = pileInconsistencies(s).filter(p => !s.pile.notes[p.key]);
  const zeroRules = s.rules.filter(r => r.active && hitSplit(r).hit.length === 0);
  const nConf = dis.length + incons.length + zeroRules.length;
  return {
    agree: cs.filter(c => c.agree).length, total: cs.length, agreeDefault, nExpert: expert.length, nConf,
    sec: {

/* 拖动调整面板大小（右侧 = 宽度；底部 = 高度，最多 50vh） */
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-resize]'); if (!h) return;
  e.preventDefault(); const l = LY(); document.body.classList.add('resizing');
  const move = ev => { if (l.dock === 'right') l.w = clampW(window.innerWidth - ev.clientX); else l.h = clampH((window.innerHeight - 56 - ev.clientY) / window.innerHeight * 100); applyLayout(); };
  const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.body.classList.remove('resizing'); saveLayout(); };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
});
document.addEventListener('dblclick', e => { if (e.target.closest && e.target.closest('[data-resize]')) { const l = LY(); if (l.dock === 'right') l.w = 440; else l.h = 42; applyLayout(); saveLayout(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-resize]') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    const l = LY(); e.preventDefault();
    if (l.dock === 'right') l.w = clampW(l.w + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? 24 : -24)); else l.h = clampH(l.h + (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? 2 : -2));
    applyLayout(); saveLayout(); return;
  }
  // 步骤页签：左右方向键切换焦点（roving tabindex）
  if (t.matches && t.matches('.steps-v2 .st') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const all = [...document.querySelectorAll('.steps-v2 .st')]; const i = all.indexOf(t);
    const n = all[(i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length]; n && n.focus(); e.preventDefault(); return;
  }
  // 可点击的 div（契约条目）支持回车
  if (e.key === 'Enter' && t.matches && t.matches('[role="button"][data-act]')) { t.click(); return; }
  if (e.key !== 'Escape' || ui.modal) return;
  const pop = document.querySelector('details.pop[open]');
  if (pop) { pop.open = false; const sm = pop.querySelector('summary'); sm && sm.focus(); return; }
  if (state.rightOpen) { state.rightOpen = false; save(); renderContract(); const b = $('.cb-title'); b && b.focus(); }
});

function nextId(s, p) { const n = s.rules.concat(s.dims).map(x => x.id).filter(id => id && id.startsWith(p)).map(id => parseInt(id.slice(p.length), 10) || 0); return p + (Math.max(0, ...n) + 1); }
function snapshot(s) { const m = {}; labeledCodes(s).forEach(c => m[c] = evaluate(ITEM[c], s.rules).verdict); return m; }
function snapDiff(s, b, a) {
  const out = { flipped: [], fixed: [], changed: [], total: 0, agreeBefore: 0, agreeAfter: 0 };
  labeledCodes(s).forEach(c => { const L = s.labels[c].v; out.total++; if (b[c] === L) out.agreeBefore++; if (a[c] === L) out.agreeAfter++; if (b[c] === L && a[c] !== L) out.flipped.push({ it: ITEM[c] }); else if (b[c] !== L && a[c] === L) out.fixed.push({ it: ITEM[c] }); });
  return out;
}
function regMsg(reg) { return `重跑 ${reg.total} 个已标注案例：一致 ${reg.agreeBefore} → <b>${reg.agreeAfter}</b>${reg.fixed.length ? `，修好 ${reg.fixed.map(x => esc(x.it.name)).join('、')}` : ''}${reg.flipped.length ? `，翻转 ${reg.flipped.length} 个（已改标）` : ''}`; }

function setLabel(s, code, v, from) {

  // ③ 规则卡片
  'rule-filter': d => { ui.ruleFilter = d.f; renderMain(); },
  'rule-new': () => openEditor({ via: 'manual' }),
  'rule-edit': d => openEditor({ ruleId: d.id }),
  'rule-toggle': d => { const s = S(); const r = clone(s.rules.find(x => x.id === d.id)); r.active = !r.active; applyRuleChange(s, r, `${r.active ? '启用' : '停用'} ${r.id}`); },
  'rule-del': d => openConfirm('删除规则？', `删除 ${esc(d.id)}，然后重跑回归。`, () => { const s = S(); const after = s.rules.filter(r => r.id !== d.id); const reg = regression(s.rules, after); s.rules = after; bump(s, 'rule', `删除 ${d.id}`, reg); save(); render(); toast(regMsg(reg)); }, '删除', true),
  'rc-scope-del': d => {
    const s = S(); const r = clone(s.rules.find(x => x.id === d.id)); r.scope[d.k] = r.scope[d.k].filter(x => x !== d.v);
    if (d.k === 'cats' && r.scope.cats.length) { const ok = r.scope.cats.flatMap(c => SUBS_BY_CAT[c]); r.scope.subs = r.scope.subs.filter(x => ok.includes(x)); }
    if (d.k === 'cats' && !r.scope.cats.length) r.scope.subs = [];
    applyRuleChange(s, r, `${r.id} 范围去掉「${d.v}」→ ${scopeText(r.scope)}`);
  },
  // ④ 纠错
  'repair-sel': d => { S().repair.selected = d.code; ui.repairMsg = null; save(); renderMain(); },
  'repair-newrule': d => {
    const s = S(), it = ITEM[d.code], e = evaluate(it, s.rules), L = s.labels[d.code].v;
    openEditor({ draft: { scope: { sources: [it.source], cats: [it.cat], subs: [it.sub] }, conds: [], action: suggestAmount(e.score, L), quote: s.repair.drafts[d.code] || '' }, target: d.code, via: 'repair', title: `新建规则：区分「${it.name}」` });
  },
  'repair-exc': d => {
    const s = S(), it = ITEM[d.code];
    const others = caseStatus(s).filter(c => c.agree && c.code !== d.code && c.e.fired.some(r => r.id === d.id)).map(c => c.it);
    const sg = distinguish(it, others);
    const ex = sg.find(g => g.field === 'spec' || g.field === 'sub') || sg[0] || (it.spec != null ? { field: 'spec', op: '≥', value: it.spec } : { field: 'sub', op: '=', value: it.sub });
    openEditor({ ruleId: d.id, target: d.code, focusExc: true, title: `给 ${d.id} 加例外（为「${it.name}」）` });
    ui.editor.draft.exceptions.push({ field: ex.field, op: ex.op, value: ex.value, quote: s.repair.drafts[d.code] || '' });
    renderModal();
  },
  'repair-off': d => { openEditor({ ruleId: d.id, target: d.code, title: `停用 ${d.id}？（先看回归）` }); ui.editor.draft.active = false; renderModal(); },
  'repair-accept': d => { const s = S(); s.accepted[d.code] = { note: s.repair.drafts[d.code] || '', ts: nowIso() }; s.log.unshift({ ts: nowIso(), kind: 'accept', text: `接受分歧：「${ITEM[d.code].name}」` }); s.repair.selected = null; save(); render(); toast('已记为“接受的分歧”（会在导出里公开占比）'); },
  'repair-relabel': d => { const s = S(); const L = s.labels[d.code]; const old = L.v; L.v = d.v; L.seed = false; L.reason = (L.reason || '') + ` 〔纠错时改标：${VERDICT[old]}→${VERDICT[d.v]}〕`; s.log.unshift({ ts: nowIso(), kind: 'label', text: `改标「${ITEM[d.code].name}」：${VERDICT[old]} → ${VERDICT[d.v]}` }); save(); render(); },
  // ⑤ 矩阵
  'cell': d => { ui.matrixCell = { cat: d.cat, src: d.src }; renderMain(); },
  'cell-triad': d => { const s = S(); const c = d && d.cat ? { cat: d.cat, src: d.src } : ui.matrixCell; if (!c) return; ui.matrixCell = c; V().fill = { cat: c.cat, src: c.src }; newTriad(s, 'cell', c); state.tab = 'triad'; save(); render(); $('#main').scrollTop = 0; },
  'cell-rule': () => { const c = ui.matrixCell; openEditor({ draft: { scope: { sources: [c.src], cats: [c.cat], subs: [] } }, via: 'matrix', title: `为 ${c.src} × ${c.cat} 新建规则` }); },
  // 编辑器
  'ed-scope': d => { const sc = ui.editor.draft.scope; const a = sc[d.k]; const i = a.indexOf(d.v); if (i >= 0) a.splice(i, 1); else a.push(d.v); if (d.k === 'cats') { const ok = sc.cats.flatMap(c => SUBS_BY_CAT[c]); sc.subs = sc.subs.filter(x => ok.includes(x)); } renderModal(); },
  'ed-add': d => { const t = ui.editor.target ? ITEM[ui.editor.target] : null; const c = { field: 'price', op: d.kind === 'exc' ? '≤' : '>', value: t && t.price != null ? t.price : '' }; if (d.kind === 'exc') { c.quote = ''; ui.editor.draft.exceptions.push(c); } else ui.editor.draft.conds.push(c); renderModal(); },
  'ed-del': d => { const arr = d.kind === 'exc' ? ui.editor.draft.exceptions : ui.editor.draft.conds; arr.splice(+d.i, 1); renderModal(); },
  'ed-sugg': d => { const g = JSON.parse(d.g); const c = { field: g.field, op: g.op, value: g.value }; if (d.kind === 'exc') { c.quote = (S().repair.drafts[ui.editor.target] || ''); ui.editor.draft.exceptions.push(c); } else ui.editor.draft.conds.push(c); renderModal(); },
  'ed-toggle-active': () => { ui.editor.draft.active = !ui.editor.draft.active; renderEdDynamic(); },
  'ed-save': () => {
    const E = ui.editor, s = S(), d = E.draft;
    const bad = [...d.conds, ...d.exceptions].find(c => { const t = FIELDS[c.field].type; return (t === 'num' && (c.value === '' || c.value == null || isNaN(+c.value))) || (t === 'text' && !c.value); });
    if (bad) { toast('有条件/例外没填值', 'err'); return; }
    const reg = regression(s.rules, edRulesAfter());
    if (reg.flipped.length && !E.force) return;
    const isNew = !E.ruleId;
    if (isNew) { d.id = nextId(s, 'R'); d.createdAt = nowIso(); d.seed = false; s.rules.push(d); } else s.rules = s.rules.map(r => r.id === E.ruleId ? d : r);
    if (reg.flipped.length && E.force) reg.flipped.forEach(x => { const L = s.labels[x.it.code]; L.v = x.a; L.seed = false; L.reason = (L.reason || '') + ` 〔因 ${d.id} 改标〕`; });
    bump(s, 'rule', `${isNew ? '新增' : '修改'} ${d.id}：${ruleOneLine(d)}${d.active ? '' : '（已停用）'}`, reg);
    const msg = `已保存 ${d.id}。` + regMsg(reg);
    if (E.target) ui.repairMsg = msg;
    closeModal(); save(); render(); $('#main').scrollTop = 0; toast(msg, 'ok');
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'overlay') { if (e.target === t) closeModal(); return; }
  if (t.tagName === 'A') e.preventDefault();
  const fn = actions[act];
  if (fn) { e.stopPropagation(); fn(t.dataset, t, e); }
});
document.addEventListener('change', e => {
  const t = e.target, s = S();
  if (t.dataset.actChange === 'im-cat') { const sub = $('#im-sub'); sub.innerHTML = SUBS_BY_CAT[t.value].map(x => `<option>${esc(x)}</option>`).join(''); return; }
  if (t.dataset.actChange === 'rate-dim') { s.triad.lastDim = t.value; save(); renderMain(); return; }
  if (t.dataset.actChange === 'pile-show') { s.pile.showContract = t.checked; save(); renderMain(); return; }
  if (t.dataset.reason) { const L = s.labels[t.dataset.reason]; if (L) { L.reason = t.value.trim(); save(); renderRight(); } return; }
  if (t.dataset.slot) { s.scenario[t.dataset.slot] = t.value; save(); return; }
  if (t.dataset.ed) edInput(t, true);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.repairDraft) { S().repair.drafts[t.dataset.repairDraft] = t.value; save(); return; }
  if (t.dataset.ed && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT') && t.type !== 'radio' && t.type !== 'checkbox') edInput(t, false);
});
function edInput(t, isChange) {
  const E = ui.editor; if (!E) return; const d = E.draft; const k = t.dataset.ed;
  if (k === 'quote') { d.quote = t.value; return; }
  if (k === 'force') { E.force = t.checked; renderEdDynamic(); return; }
  if (k === 'action') { if (t.dataset.p === 'type') { d.action.type = t.value; renderModal(); } else { d.action.amount = +t.value; renderEdDynamic(); } return; }
  if (k === 'cond' || k === 'exc') {
    const arr = k === 'exc' ? d.exceptions : d.conds; const c = arr[+t.dataset.i]; const p = t.dataset.p;
    if (p === 'field') {
      if (!isChange) return;
      c.field = t.value; const f = FIELDS[c.field]; const tg = E.target ? ITEM[E.target] : null;
      c.op = OPS[f.type][0]; c.value = f.type === 'enum' ? (tg ? tg.sub : ITEMS[0].sub) : f.type === 'bool' ? '无' : f.type === 'num' ? (tg && f.get(tg) != null ? f.get(tg) : '') : '';
      renderModal(); return;
    }
    if (p === 'quote') { c.quote = t.value; return; }
    if (p === 'value') { const f = FIELDS[c.field]; c.value = f.type === 'num' ? (t.value.trim() === '' ? '' : (isNaN(+t.value) ? t.value : +t.value)) : t.value; }
    if (p === 'op') c.op = t.value;
    renderEdDynamic();
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) closeModal(); });
document.addEventListener('toggle', e => { const sec = e.target.dataset && e.target.dataset.sec; if (sec) ui.open[sec] = e.target.open; }, true);
// 拖放
document.addEventListener('dragstart', e => { const it = e.target.closest && e.target.closest('.item[draggable="true"]'); if (!it) return; e.dataTransfer.setData('text/plain', it.dataset.code); e.dataTransfer.effectAllowed = 'move'; it.classList.add('dragging'); });
document.addEventListener('dragend', e => { const it = e.target.closest && e.target.closest('.item'); if (it) it.classList.remove('dragging'); document.querySelectorAll('.pile-col.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.pile-col'); if (!col) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; document.querySelectorAll('.pile-col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('.pile-col'); if (!col) return; e.preventDefault(); const code = e.dataTransfer.getData('text/plain'); col.classList.remove('over'); if (code && ITEM[code]) actions['pile-set']({ code, v: col.dataset.pile }); });

/* ---------- v0.2 新增：步骤页签间的跳转、契约面板 ---------- */
Object.assign(actions, {
  'b-rule': d => { V().ruleSel = d.id; renderMain(); if (state.rightOpen) renderContract(); },
  // ④ → ③：带着当前案例跳去改相关规则，③ 顶部出现“← 回到 ④”条
  'jump-rule': d => {
    const it = ITEM[d.code];
    V().back = { on: 'rules', to: 'repair', code: d.code, label: `④ 纠错：${it ? it.name : ''}`, hint: d.id ? `从这个分歧跳来改 ${d.id}；改完回去看它是否已一致` : '从这个分歧跳来' };
    if (d.id) gotoRule(d.id); else { state.tab = 'rules'; ui.ruleFilter = 'all'; save(); render(); $('#main').scrollTop = 0; }
  },
  'go-back': () => {
    const f = V().fill;
    if (state.tab === 'triad' && f) { V().fill = null; ui.matrixCell = { cat: f.cat, src: f.src }; state.tab = 'matrix'; save(); render(); return; }
    const b = V().back; if (!b) return; V().back = null;
    if (b.to === 'repair' && b.code) S().repair.selected = b.code;
    state.tab = b.to; ui.repairMsg = null; save(); render(); $('#main').scrollTop = 0;
  },
  'back-dismiss': () => { V().back = null; renderMain(); },
  'fill-clear': () => { V().fill = null; renderMain(); },
  // 契约面板：条上的分区按钮 = 打开到该标签（再点一次收起）；面板内标签 = 切换
  'cp-tab': d => { const l = LY(); if (d.from === 'bar' && state.rightOpen && l.tab === d.k) state.rightOpen = false; else { l.tab = d.k; state.rightOpen = true; } saveLayout(); save(); renderContract(); },
  'cp-close': () => { state.rightOpen = false; save(); renderContract(); const b = $('.cb-title'); b && b.focus(); },
  'cp-dock': () => { const l = LY(); l.dock = l.dock === 'right' ? 'bottom' : 'right'; saveLayout(); renderContract(); },
});

state = loadState();
applyOverrides();
render();
save();

</script>
</body>
</html>
